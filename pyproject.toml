[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eu-regulatory-rag"
version = "0.1.0"
description = "RAG platform for DORA & NIS2 EU regulatory compliance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "zeep>=4.2.0",
    "tiktoken>=0.7.0",
    "sse-starlette>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
eurlex-ingest = "ingestion.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = [
    "ingestion",
    "embeddings",
    "vectordb",
    "rag",
    "api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
